name: build

on:
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

# cancel older runs of the same branch so the "latest" release is never raced
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Finds the plugin project (repo root or a subfolder)
      - name: Locate project
        id: p
        run: |
          f=$(find . -name build.gradle.kts -not -path './.git/*' | head -n1)
          if [ -z "$f" ]; then
            echo "::error::build.gradle.kts not found. Upload build.gradle.kts, settings.gradle.kts and src/ to the repo."
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      # Regenerate the texture pack from the model on every build
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/build_pack.py"

      - name: Build texture pack
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          pip install pillow
          s=$(find . -name build_pack.py -not -path './.git/*' | head -n1)
          if [ -z "$s" ]; then
            echo "::error::build_pack.py not found (expected tools/build_pack.py)."
            find . -type f -not -path './.git/*' | sort | head -60
            exit 1
          fi
          if [ ! -f src/main/resources/models/reforged_frost_armor.bbmodel ]; then
            echo "::error::src/main/resources/models/reforged_frost_armor.bbmodel is missing."
            find . -type f -not -path './.git/*' | sort | head -60
            exit 1
          fi
          python "$s"
          test -s src/main/resources/pack.zip

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Point the plugin at this repo's release asset (players download with no open port)
      - name: Set pack URL
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          sed -i "s#REPO_SLUG#${{ github.repository }}#" src/main/resources/config.yml
          grep -n "external-url" src/main/resources/config.yml

      - name: Build
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle build --no-daemon

      # sanity check: the jar must contain the pack and the resolved URL
      - name: Verify jar
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          unzip -l build/libs/ReforgedFrost.jar | grep -E "pack.zip|plugin.yml|config.yml"
          unzip -p build/libs/ReforgedFrost.jar config.yml | grep -q "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ReforgedFrost
          path: |
            ${{ steps.p.outputs.dir }}/build/libs/ReforgedFrost.jar
            ${{ steps.p.outputs.dir }}/src/main/resources/pack.zip

      # Only the default branch (or a manual run) updates the public "latest" release
      - name: Publish latest release
        if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest \
            "${{ steps.p.outputs.dir }}/build/libs/ReforgedFrost.jar" \
            "${{ steps.p.outputs.dir }}/src/main/resources/pack.zip" \
            --title "Latest build" \
            --notes "Auto-built from ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA"
